
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-geometry"
version = "0.1.0"
description = "3D geometry, calibration and validation toolkit"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not bench"]
markers = [
    "bench: benchmark-harness smoke tests (deselected by default; run with -m bench)",
]

